[build-system]
requires = ["setuptools>=77", "wheel", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "django-celery-logs"
requires-python = ">=3.10"
dynamic = [
    "authors",
    "classifiers",
    "dependencies",
    "description",
    "keywords",
    "license",
    "readme",
    "urls",
    "version",
]

[project.optional-dependencies]
dev = [
    "build",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "setuptools>=64",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-intl",
    "sphinxjp.themes.basicstrap",
    "twine",
    "wheel",
]
